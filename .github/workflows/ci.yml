name: ci

on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - name: CPU build of PyTorch (the CUDA wheels are not needed)
        run: pip install torch --index-url https://download.pytorch.org/whl/cpu
      - run: pip install -e ".[dev]"
      - run: pytest -v

  spark:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install "pyspark>=3.5" numpy pandas pyarrow scipy scikit-learn pytest
      - name: Spark and pandas apply the same cleaning; Spark ALS trains
        run: PYTHONPATH=. pytest -v tests/test_spark_parity.py
      - name: Spark job on the sample
        run: python spark/etl_als.py data/sample_lines.csv
